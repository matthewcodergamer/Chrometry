name: Deploy Chrometry to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify JavaScript
        run: |
          node --check app.js
          node --check ui-polish.js

      - name: Generate final Chrometry icon assets
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert -w 180 -h 180 chrometry-home-icon.svg -o apple-touch-icon-v7.png
          rsvg-convert -w 192 -h 192 chrometry-home-icon.svg -o icon-192-v7.png
          rsvg-convert -w 512 -h 512 chrometry-home-icon.svg -o icon-512-v7.png
          test -s apple-touch-icon-v7.png
          test -s icon-192-v7.png
          test -s icon-512-v7.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
