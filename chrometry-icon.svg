<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Chrometry">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25272D"/>
      <stop offset="0.52" stop-color="#15171C"/>
      <stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <radialGradient id="bgSheen" cx="0.28" cy="0.08" r="0.92">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".075"/>
      <stop offset=".36" stop-color="#FFFFFF" stop-opacity=".022"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94C9FF"/>
      <stop offset=".5" stop-color="#6BA9FA"/>
      <stop offset="1" stop-color="#4D8EF2"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AF0B7"/>
      <stop offset=".5" stop-color="#72DC93"/>
      <stop offset="1" stop-color="#54C875"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE79B"/>
      <stop offset=".5" stop-color="#FFD36C"/>
      <stop offset="1" stop-color="#F5BC47"/>
    </linearGradient>
    <linearGradient id="edgeSpec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".52"/>
      <stop offset=".13" stop-color="#FFFFFF" stop-opacity=".24"/>
      <stop offset=".34" stop-color="#FFFFFF" stop-opacity=".075"/>
      <stop offset=".62" stop-color="#FFFFFF" stop-opacity=".018"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="barShadow" x="-40%" y="-20%" width="180%" height="160%">
      <feDropShadow dx="0" dy="17" stdDeviation="18" flood-color="#000000" flood-opacity=".20"/>
    </filter>
  </defs>

  <!-- One full-bleed dark master. iOS/Safari apply their own outer masking. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#bgSheen)"/>

  <!-- Intentionally staggered heights so the identity survives tiny favicon rendering. -->
  <g filter="url(#barShadow)">
    <g>
      <rect x="158" y="232" width="176" height="560" rx="88" fill="url(#blue)"/>
      <rect x="162" y="236" width="168" height="552" rx="84" fill="none" stroke="#FFFFFF" stroke-opacity=".15" stroke-width="7"/>
      <path d="M205 309c0-34 27-61 61-61" fill="none" stroke="url(#edgeSpec)" stroke-width="15" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="424" y="146" width="176" height="724" rx="88" fill="url(#green)"/>
      <rect x="428" y="150" width="168" height="716" rx="84" fill="none" stroke="#FFFFFF" stroke-opacity=".17" stroke-width="7"/>
      <path d="M471 223c0-34 27-61 61-61" fill="none" stroke="url(#edgeSpec)" stroke-width="15" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="690" y="205" width="176" height="614" rx="88" fill="url(#gold)"/>
      <rect x="694" y="209" width="168" height="606" rx="84" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="7"/>
      <path d="M737 282c0-34 27-61 61-61" fill="none" stroke="url(#edgeSpec)" stroke-width="15" stroke-linecap="round"/>
    </g>
  </g>
</svg>
