<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Chrometry">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24262C"/>
      <stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FC5FF"/>
      <stop offset="1" stop-color="#4E90F4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93EDB1"/>
      <stop offset="1" stop-color="#55C975"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE495"/>
      <stop offset="1" stop-color="#F6BE49"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background. iOS applies the Home Screen icon mask. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Exact optical proportions of the in-app 44px Chrometry brand mark:
       7px padding, 4px grid gaps, side bars inset 2px vertically. -->
  <rect x="163" y="210" width="171" height="604" rx="86" fill="url(#blue)" stroke="#FFFFFF" stroke-opacity=".23" stroke-width="8"/>
  <rect x="427" y="163" width="171" height="698" rx="86" fill="url(#green)" stroke="#FFFFFF" stroke-opacity=".23" stroke-width="8"/>
  <rect x="691" y="210" width="171" height="604" rx="86" fill="url(#gold)" stroke="#FFFFFF" stroke-opacity=".23" stroke-width="8"/>

  <!-- Restrained top-left inset glints matching the header mark, not a separate icon style. -->
  <path d="M211 283c0-25 20-45 45-45" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="10" stroke-linecap="round"/>
  <path d="M475 236c0-25 20-45 45-45" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="10" stroke-linecap="round"/>
  <path d="M739 283c0-25 20-45 45-45" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="10" stroke-linecap="round"/>
</svg>
