<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Chrometry" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25272D"/>
      <stop offset="0.52" stop-color="#15171C"/>
      <stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <radialGradient id="bgSheen" cx="0.28" cy="0.08" r="0.92">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".065"/>
      <stop offset=".36" stop-color="#FFFFFF" stop-opacity=".018"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94C9FF"/>
      <stop offset=".5" stop-color="#6BA9FA"/>
      <stop offset="1" stop-color="#4D8EF2"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AF0B7"/>
      <stop offset=".5" stop-color="#72DC93"/>
      <stop offset="1" stop-color="#54C875"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE79B"/>
      <stop offset=".5" stop-color="#FFD36C"/>
      <stop offset="1" stop-color="#F5BC47"/>
    </linearGradient>
    <linearGradient id="edgeSpec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".48"/>
      <stop offset=".14" stop-color="#FFFFFF" stop-opacity=".21"/>
      <stop offset=".34" stop-color="#FFFFFF" stop-opacity=".065"/>
      <stop offset=".62" stop-color="#FFFFFF" stop-opacity=".012"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#bgSheen)"/>

  <!-- Blue and yellow are the same shorter height; green is the single tallest bar. -->
  <g>
    <rect x="158" y="232" width="176" height="560" rx="88" fill="url(#blue)"/>
    <rect x="162" y="236" width="168" height="552" rx="84" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="6"/>
    <path d="M205 309c0-34 27-61 61-61" fill="none" stroke="url(#edgeSpec)" stroke-width="11" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="424" y="146" width="176" height="724" rx="88" fill="url(#green)"/>
    <rect x="428" y="150" width="168" height="716" rx="84" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="6"/>
    <path d="M471 223c0-34 27-61 61-61" fill="none" stroke="url(#edgeSpec)" stroke-width="11" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="690" y="232" width="176" height="560" rx="88" fill="url(#gold)"/>
    <rect x="694" y="236" width="168" height="552" rx="84" fill="none" stroke="#FFFFFF" stroke-opacity=".15" stroke-width="6"/>
    <path d="M737 309c0-34 27-61 61-61" fill="none" stroke="url(#edgeSpec)" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
