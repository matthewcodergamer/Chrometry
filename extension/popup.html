<!doctype html><html><head><meta charset="utf-8"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;width:280px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;background:#101014;color:#f4f4f7}header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}header b{font-size:14px}header small{display:block;color:#8e8e98;font-size:9px;letter-spacing:.12em}.mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4e90f4,#55c975 55%,#f6be49)}.row{padding:0 14px 12px;display:grid;gap:8px}button{width:100%;min-height:40px;border:0;border-radius:12px;font:800 12px/1 inherit;cursor:pointer}#pick{background:#f4f4f7;color:#111}#open{background:#1d1d22;color:#f4f4f7}.swatches{display:flex;flex-wrap:wrap;gap:6px}.swatch{width:32px;height:32px;border-radius:8px;border:1px solid #ffffff22;cursor:pointer}.meta{color:#8e8e98;font-size:11px;min-height:16px}.toast{text-align:center;color:#67d79a;font-weight:800;font-size:11px;min-height:16px}</style></head><body><header><div class="mark"></div><div><b>Chrometry</b><small>EYEDROPPER</small></div></header><div class="row"><button id="pick" type="button">Pick a color</button><div class="meta" id="meta">Click, then sample any pixel on the page.</div><div class="swatches" id="swatches"></div><div class="toast" id="toast"></div><button id="open" type="button">Open in Chrometry</button></div><script src="popup.js"></script></body></html>
