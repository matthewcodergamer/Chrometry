<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrometry</title><style>*{box-sizing:border-box}body{margin:0;width:360px;background:#0e0e12;color:#f7f7fa;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:16px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}.brand img{width:34px;height:34px}.brand b{font-size:16px}.brand small{display:block;color:#9999a4;font-size:10px;letter-spacing:.12em;margin-top:2px}.hero{border:1px solid #2b2b34;background:linear-gradient(145deg,#19191f,#101014);border-radius:18px;padding:18px}.hero h1{font-size:21px;margin:0 0 7px}.hero p{font-size:12px;line-height:1.5;color:#a8a8b2;margin:0 0 15px}button{width:100%;border:0;border-radius:13px;padding:12px 14px;font-weight:700;font-size:13px;background:#fff;color:#101014}.secondary{margin-top:8px;background:#24242b;color:#fff;border:1px solid #363640}.status{font-size:11px;color:#8f8f9b;min-height:17px;margin-top:10px;text-align:center}.tip{font-size:11px;color:#858591;line-height:1.45;margin-top:14px}</style></head><body><div class="wrap"><div class="brand"><img src="chrometry-48.png" alt=""><div><b>Chrometry</b><small>LIVE COLOR PICKER</small></div></div><div class="hero"><h1>Pick from this page.</h1><p>Activate the dropper, then move over anything on the webpage. Click to capture the exact screen color and get HEX, RGB, HSL and page-element details.</p><button id="pick">🎯 Pick a color</button><button id="web" class="secondary">Open full Chrometry</button><div id="status" class="status"></div></div><div class="tip">No manual screenshot required. Chrometry runs the picker directly over the page.</div></div><script src="popup.js"></script></body></html>
